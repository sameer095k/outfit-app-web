<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Closet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23f7f1e5'/%3E%3Cg stroke='%233a3026' stroke-width='8' fill='none'%3E%3Cpath d='M60 70 h60'/%3E%3Cpath d='M70 70 v60 M110 70 v60'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"Closet","short_name":"Closet","display":"standalone","background_color":"%23f7f1e5","theme_color":"%23f7f1e5","start_url":"."}'>
<title>Closet</title>
<style>
:root{
  --cream:#f7f1e5; --paper:#fffdf6; --ink:#3a3026; --muted:#8c7d69;
  --line:#e7dac2; --accent:#c96f4a; --accent-dk:#a5562f;
  --sage:#a3b18a; --sand:#d9b98f; --rose:#d49a94; --navy:#3d4e6d;
  --ok:#4e7c4e; --warn:#b3541e;
  --r:18px;
  --tab-h:76px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:#e8dec8; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; justify-content:center;
}
#app{
  width:100%; max-width:480px; height:100vh; height:100dvh; background:var(--cream);
  display:flex; flex-direction:column; position:relative; overflow:hidden;
  box-shadow:0 0 40px rgba(58,48,38,.18);
}
/* top bar */
#topbar{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 18px 10px;
  border-bottom:2px solid var(--line); background:var(--cream); z-index:5;
}
#topbar h1{margin:0; font-size:26px; letter-spacing:.5px;}
#menu-btn{
  width:48px; height:48px; border-radius:50%; border:2px solid var(--ink);
  background:var(--paper); font-size:22px; line-height:1; cursor:pointer; color:var(--ink);
}
#menu-pop{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 66px); right:12px;
  background:var(--paper); border:2px solid var(--ink); border-radius:14px;
  box-shadow:0 8px 24px rgba(58,48,38,.2); z-index:60; min-width:200px; display:none;
}
#menu-pop.open{display:block;}
#menu-pop button{
  display:block; width:100%; text-align:left; padding:16px; font-size:17px;
  background:none; border:none; color:var(--ink); cursor:pointer;
}
.loginwrap{ min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
.logincard{ width:100%; max-width:340px; background:#fffdf6; border:2.5px solid var(--ink); border-radius:20px; padding:28px 24px; text-align:center; box-shadow:0 8px 24px rgba(58,48,38,.12); }
.logincard h2{ margin:0 0 4px; font-size:24px; }
.logincard p{ margin:0 0 18px; opacity:.65; font-size:14px; }
.logincard input{ width:100%; box-sizing:border-box; margin:0 0 10px; padding:12px 14px; font-size:16px; border:2px solid var(--ink); border-radius:12px; background:#fff; font-family:inherit; }
#login-err{ min-height:20px; color:#a83a3a; font-size:13px; font-weight:600; margin-bottom:6px; }
#login-go{ width:100%; padding:13px; font-size:16px; font-weight:800; color:#fffdf6; background:var(--ink); border:none; border-radius:12px; cursor:pointer; font-family:inherit; }
/* views */
#views{flex:1 1 auto; overflow:hidden; position:relative;}
.view{position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:16px 16px calc(var(--tab-h) + 24px); display:none;}
.view.active{display:block;}
/* locked no-scroll closet overview (fits iPhone 16/17 viewport) */
#view-closet.locked{overflow:hidden;}
#view-closet.locked.active{display:flex; flex-direction:column; padding:12px 16px 84px;}
#view-closet .roomwrap{flex:1 1 auto; min-height:0; display:flex; margin-top:10px;}
#view-closet .roomwrap svg{width:100%; height:100%; display:block;}
.fab{
  position:absolute; right:18px; bottom:20px; width:60px; height:60px; border-radius:50%;
  background:var(--ink); color:var(--cream); font-size:32px; line-height:1;
  border:none; box-shadow:0 6px 18px rgba(58,48,38,.35); cursor:pointer; z-index:6;
}
.fab:active{transform:scale(.94);}
.subview{display:none; animation:slidein .22s ease;}
.subview.active{display:block;}
@keyframes slidein{from{transform:translateX(26px); opacity:0;} to{transform:none; opacity:1;}}
/* tab bar */
#tabbar{
  flex:0 0 auto; height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; background:var(--paper); border-top:2px solid var(--ink); z-index:5;
}
#tabbar button{
  flex:1; border:none; background:none; cursor:pointer; color:var(--muted);
  font-size:15px; font-weight:600; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:7px; min-height:var(--tab-h);
}
#tabbar button .dot{width:13px; height:13px; border-radius:50%; border:2.5px solid currentColor;}
#tabbar button.active{color:var(--ink);}
#tabbar button.active .dot{background:var(--ink);}
/* generic */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:52px; padding:12px 22px; border-radius:999px;
  border:2.5px solid var(--ink); background:var(--ink); color:var(--paper);
  font-size:17px; font-weight:700; cursor:pointer;
}
.btn.secondary{background:var(--paper); color:var(--ink);}
.btn.danger{background:#fff; color:#a33327; border-color:#a33327;}
.btn.small{min-height:44px; padding:8px 16px; font-size:15px;}
.btn.block{width:100%;}
.btn:disabled{opacity:.45;}
h2.sec{font-size:22px; margin:18px 4px 10px;}
.hint{color:var(--muted); font-size:15px; margin:6px 4px 12px;}
.empty{
  text-align:center; padding:48px 28px; color:var(--muted);
  border:2.5px dashed var(--line); border-radius:var(--r); background:var(--paper);
  margin-top:14px;
}
.empty .big{font-size:44px; margin-bottom:10px;}
.empty p{margin:8px 0 18px; font-size:16px; line-height:1.45;}
/* chips */
.chips{display:flex; flex-wrap:wrap; gap:10px; margin:4px 2px 12px;}
.chip{
  min-height:44px; padding:9px 18px; border-radius:999px; font-size:15px; font-weight:600;
  border:2px solid var(--ink); background:var(--paper); color:var(--ink); cursor:pointer;
}
.chip.on{background:var(--ink); color:var(--paper);}
.chip.sm{min-height:38px; padding:6px 14px; font-size:14px;}
.filterbtn{
  margin-left:auto; min-height:38px; padding:6px 14px; border-radius:999px;
  border:2px solid var(--line); background:var(--paper); color:var(--muted);
  font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; flex:0 0 auto;
}
.filterbtn.on{background:var(--ink); border-color:var(--ink); color:var(--paper);}
/* cards & grids */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.card{
  background:var(--paper); border:2.5px solid var(--ink); border-radius:var(--r);
  overflow:hidden; cursor:pointer; position:relative;
}
.card img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--line);}
.card .meta{padding:10px 12px 12px;}
.card .meta .nm{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .meta .tg{color:var(--muted); font-size:13px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card .check{
  position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
  background:var(--paper); border:2.5px solid var(--ink); display:none;
  align-items:center; justify-content:center; font-size:18px; font-weight:800;
}
.card.sel .check{display:flex; background:var(--sage);}
/* closet svg */
#closet-svg{width:100%; height:auto; display:block;}
.zone{cursor:pointer;}
.zone.hidden-sec{opacity:.18; pointer-events:none;}
.zone:active .zonehit{fill:rgba(58,48,38,.08);}
.backrow{display:flex; align-items:center; gap:10px; margin:2px 0 8px;}
.backrow h2{margin:0; font-size:24px;}
.linkbtn{background:none; border:none; color:var(--ink); font-size:17px; font-weight:700; cursor:pointer; padding:12px 8px;}
/* sheets & modals */
.scrim{
  position:fixed; inset:0; background:rgba(58,48,38,.45); z-index:50;
  display:none; align-items:flex-end; justify-content:center;
}
.scrim.open{display:flex;}
.sheet{
  width:100%; max-width:480px; max-height:88vh; max-height:88dvh; overflow-y:auto;
  background:var(--cream); border-radius:26px 26px 0 0; border-top:3px solid var(--ink);
  padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 22px);
  animation:rise .25s ease;
}
@keyframes rise{from{transform:translateY(60px); opacity:.6;} to{transform:none; opacity:1;}}
.grab{width:52px; height:6px; border-radius:3px; background:var(--line); margin:2px auto 14px;}
.sheet h3{margin:4px 0 12px; font-size:21px;}
.rowbtns{display:flex; gap:12px; margin-top:16px;}
.rowbtns .btn{flex:1;}
.field{margin:12px 0;}
.field label{display:block; font-weight:700; font-size:15px; margin-bottom:8px;}
.field input[type=text]{
  width:100%; min-height:52px; font-size:17px; padding:12px 16px;
  border:2.5px solid var(--ink); border-radius:14px; background:var(--paper); color:var(--ink);
}
.previewbox{
  width:100%; aspect-ratio:4/3; border-radius:var(--r); border:2.5px dashed var(--line);
  background:var(--paper); display:flex; align-items:center; justify-content:center;
  overflow:hidden; color:var(--muted); font-size:15px; margin-bottom:6px;
}
.previewbox img{width:100%; height:100%; object-fit:cover;}
/* detail */
.dphoto{width:100%; border-radius:var(--r); border:2.5px solid var(--ink); display:block; background:var(--line);}
.tagline{font-size:15px; color:var(--muted); margin:10px 2px;}
.tagline b{color:var(--ink);}
.wearlog{margin:8px 0; padding:0; list-style:none;}
.wearlog li{
  padding:12px 4px; border-bottom:1.5px solid var(--line); font-size:16px;
  display:flex; justify-content:space-between; align-items:center;
}
.warn{
  background:#fbeedf; border:2px solid var(--warn); color:var(--warn);
  border-radius:14px; padding:12px 16px; font-size:15px; font-weight:600; margin:12px 0;
}
/* fit composite */
.composite{background:var(--paper); border:2.5px solid var(--ink); border-radius:var(--r); overflow:hidden; margin:12px 0;}
.composite .piece{border-bottom:2px solid var(--line); padding:10px; display:flex; gap:12px; align-items:center;}
.composite .piece:last-child{border-bottom:none;}
.composite .piece img{width:84px; height:84px; object-fit:cover; border-radius:12px; border:2px solid var(--ink); flex:0 0 auto;}
.composite .piece .pl{font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase;}
.composite .piece .pn{font-weight:700; font-size:16px;}
.fitrow{
  display:flex; gap:12px; align-items:center; background:var(--paper);
  border:2.5px solid var(--ink); border-radius:var(--r); padding:10px; margin-bottom:12px; cursor:pointer;
}
.fitrow .thumbs{display:flex;}
.fitrow .thumbs img{width:52px; height:52px; object-fit:cover; border-radius:10px; border:2px solid var(--ink); margin-right:-12px; background:var(--line);}
.fitrow .fi{flex:1; min-width:0;}
.fitrow .fi .fn{font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.fitrow .fi .fo{color:var(--muted); font-size:13px;}
/* planner */
.daycard{background:var(--paper); border:2.5px solid var(--ink); border-radius:var(--r); margin-bottom:12px; overflow:hidden;}
.daycard.today{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent);}
.daycard header{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:2px solid var(--line);}
.daycard header .dn{font-weight:800; font-size:17px;}
.daycard header .dd{color:var(--muted); font-size:14px;}
.slot{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:14px 16px; background:none; border:none; border-bottom:1.5px solid var(--line);
  font-size:16px; cursor:pointer; color:var(--ink); min-height:56px;}
.slot:last-child{border-bottom:none;}
.slot .sl{font-size:12px; font-weight:800; letter-spacing:1px; color:var(--muted); width:52px; flex:0 0 auto;}
.slot .sv{flex:1; font-weight:600;}
.slot .sv.empty{color:var(--muted); font-weight:400;}
.slot .mini{font-size:13px; font-weight:700; padding:8px 10px; border:2px solid var(--ink); border-radius:10px; background:var(--cream);}
.weeknav{display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px;}
.weeknav button{width:52px; height:52px; border-radius:50%; border:2.5px solid var(--ink); background:var(--paper); font-size:22px; cursor:pointer; color:var(--ink);}
.weeknav .wl{font-weight:800; font-size:17px;}
/* compare */
.cmp{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.cmp .col{background:var(--paper); border:2.5px solid var(--ink); border-radius:var(--r); overflow:hidden;}
.cmp .col img{width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:var(--line);}
.cmp .col .cm{padding:10px 12px;}
.cmp .col .cm .n{font-weight:700; font-size:15px;}
.cmp .col .cm .t{color:var(--muted); font-size:13px; margin-top:4px; line-height:1.4;}
/* toast */
#toast{
  position:fixed; left:50%; bottom:calc(var(--tab-h) + 24px); transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--paper); padding:14px 22px; border-radius:999px;
  font-size:15px; font-weight:600; opacity:0; transition:all .25s; z-index:100; pointer-events:none;
  max-width:90vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%);}
.stickybar{
  position:sticky; bottom:0; background:linear-gradient(transparent, var(--cream) 30%);
  padding:18px 0 6px; display:flex; gap:12px;
}
.stickybar .btn{flex:1;}
.hiddenfile{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1 id="topbar-title">My Closet</h1>
    <button id="menu-btn" aria-label="Menu">⋯</button>
  </header>
  <div id="menu-pop"><button id="export-btn">⬇ Export backup</button><button id="logout-btn">Log out</button></div>
  <main id="views">
    <section id="view-closet" class="view active"></section>
    <section id="view-fits" class="view"></section>
    <section id="view-planner" class="view"></section>
    <section id="view-shuffle" class="view"></section>
  </main>
  <nav id="tabbar">
    <button data-tab="closet" class="active"><span class="dot"></span>Closet</button>
    <button data-tab="fits"><span class="dot"></span>Fits</button>
    <button data-tab="planner"><span class="dot"></span>Planner</button>
  </nav>
</div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="file-input" class="hiddenfile" accept="image/*">
<script>
"use strict";

/* ================= Data: sections & tags (spec section 11) ================= */
const SECTIONS = [
  {key:"bags",    label:"Bags",     categories:["tote","crossbody","clutch","backpack","satchel"]},
  {key:"tops",    label:"Tops",     categories:["shirt","blouse","tee","sweater","cardigan","tunic"]},
  {key:"bottoms", label:"Bottoms",  categories:["jeans","trousers","skirt","leggings","palazzo"]},
  {key:"dresses", label:"Dresses",  categories:["maxi","midi","mini","abaya","kaftan"]},
  {key:"shoes",   label:"Shoes",    categories:["heels","flats","sandals","sneakers","boots"]},
  {key:"jackets", label:"Jackets",  categories:["blazer","denim jacket","coat","cardigan","shawl"]},
  {key:"jewelry", label:"Jewelry",  categories:["necklace","earrings","bracelet","ring","brooch"]},
  {key:"hijab",   label:"Hijab",    categories:["chiffon","jersey","silk","cotton","modal"]},
];
const COLORS = ["black","white","cream","beige","brown","gray","red","rust","pink","rose","orange","yellow","mustard","green","olive","sage","blue","navy","teal","purple","maroon","gold","silver","multicolor"];
const FABRICS = ["cotton","linen","silk","chiffon","jersey","denim","knit","wool","velvet","satin","polyester","leather"];
const VIBES = ["casual","work","dressy","night out","formal","modest","sporty","cozy"];
const OCCASIONS = ["casual","work","dressy","night out","formal","errands","wedding","sporty"];
const COMPOSITE_ORDER = ["hijab","tops","dresses","bottoms","shoes","bags","jewelry","jackets"];
const SINGULAR = {bags:"Bag",tops:"Top",bottoms:"Bottom",dresses:"Dress",shoes:"Shoe",jackets:"Jacket",jewelry:"Piece",hijab:"Hijab"};
const secOf = k => SECTIONS.find(s=>s.key===k);

/* ================= Cloud API (replaces IndexedDB) ================= */
const API = "https://abeerscloset.sameersapp.workers.dev";
async function apiReq(path, opts = {}) {
  const r = await fetch(API + path, { credentials: "include", ...opts });
  if (r.status === 401) { showLogin(); throw new Error("auth"); }
  if (!r.ok) throw new Error("api " + r.status);
  const ct = r.headers.get("Content-Type") || "";
  return ct.includes("json") ? r.json() : r;
}
const mapItem = (it) => (it ? { ...it, full: it.photo, thumb: it.thumb } : it);
async function dbOpen() { /* session checked at boot */ }
async function dbAll(store) {
  if (store === "items") return (await apiReq("/api/items")).items.map(mapItem);
  if (store === "fits") return (await apiReq("/api/fits")).fits;
  if (store === "slots") return (await apiReq("/api/slots")).slots;
  return [];
}
async function dbGet(store, key) {
  if (store === "items")
    return mapItem((await apiReq("/api/items/" + encodeURIComponent(key))).item);
  if (store === "fits")
    return (await apiReq("/api/fits/" + encodeURIComponent(key))).fit;
}
async function dbPut(store, val) {
  if (store === "items") {
    const { full, thumb, photo, ...meta } = val;
    await apiReq("/api/items/" + encodeURIComponent(val.id), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(meta),
    });
    const fd = new FormData();
    let up = false;
    if (full instanceof Blob) { fd.append("full", full, "full.jpg"); up = true; }
    if (thumb instanceof Blob) { fd.append("thumb", thumb, "thumb.jpg"); up = true; }
    if (up) await apiReq("/api/items/" + encodeURIComponent(val.id) + "/photo", { method: "POST", body: fd });
  } else if (store === "fits") {
    await apiReq("/api/fits/" + encodeURIComponent(val.id), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(val),
    });
  } else if (store === "slots") {
    await apiReq("/api/slots/" + encodeURIComponent(val.slotId), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fitId: val.fitId }),
    });
  }
}
async function dbDel(store, key) {
  const p = store === "items" ? "/api/items/" : store === "fits" ? "/api/fits/" : "/api/slots/";
  await apiReq(p + encodeURIComponent(key), { method: "DELETE" });
}

/* ================= Utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function todayISO(d){
  d = d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  const [y,m,dd]=iso.split("-").map(Number);
  return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function daysAgo(iso){
  const [y,m,d]=iso.split("-").map(Number);
  return Math.round((Date.now()-new Date(y,m-1,d).getTime())/864e5);
}
let toastT=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}
/* object URLs for blobs */
let urlCache=[];
function burl(blob){
  if(!blob) return "";
  if(typeof blob==="string") return blob; // cloud photo URL
  const u=URL.createObjectURL(blob); urlCache.push(u); return u;
}
function clearURLs(){ urlCache.forEach(u=>{try{URL.revokeObjectURL(u)}catch(e){}}); urlCache=[]; }

/* ================= Images ================= */
async function downscale(file, maxEdge, quality, keepAlpha){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, maxEdge/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(bmp,0,0,w,h);
  const type = (keepAlpha||/png/i.test(file.type)) ? "image/png" : "image/jpeg";
  const q = type==="image/png" ? undefined : quality;
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode failed")), type, q));
}
async function processPhoto(file, keepAlpha){
  const full = await downscale(file, 1024, 0.8, keepAlpha);
  const thumb = await downscale(file, 256, 0.7, keepAlpha);
  return {full, thumb};
}
function blobToDataURL(blob){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(blob); });
}
function dataURLToBlob(durl){
  const [head, data] = durl.split(",");
  const mime = (head.match(/:(.*?);/)||[])[1]||"image/jpeg";
  const bin = atob(data); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

async function renderCloset(){
  const v=$("#view-closet"); clearURLs();
  const items=await dbAll("items");
  const counts={}; items.forEach(it=>counts[it.section]=(counts[it.section]||0)+1);
  if(!S.zone){
    v.classList.add("locked");
    v.innerHTML=`
      <div class="roomwrap">${closetSVG(counts)}</div>
      <button class="fab" id="add-first" aria-label="Add a piece">＋</button>`;
    v.querySelectorAll(".zone[data-sec]").forEach(z=>z.addEventListener("click",()=>{
      S.zone=z.dataset.sec; S.zoneTagFilter={color:null,fabric:null,vibe:null}; renderCloset();
    }));
    $("#add-first").addEventListener("click",()=>openAddItem());
  } else {
    v.classList.remove("locked");
    renderZone(v, items, S.zone);
  }
}

async function renderZone(v, items, secKey){
  const sec=secOf(secKey);
  const list=items.filter(i=>i.section===secKey)
    .filter(i=>(!S.zoneTagFilter.color||i.color.includes(S.zoneTagFilter.color))
            &&(!S.zoneTagFilter.fabric||i.fabric.includes(S.zoneTagFilter.fabric))
            &&(!S.zoneTagFilter.vibe||i.vibe.includes(S.zoneTagFilter.vibe)));
  const nf=[S.zoneTagFilter.color,S.zoneTagFilter.fabric,S.zoneTagFilter.vibe].filter(Boolean).length;
  v.innerHTML=`
    <div class="subview active">
    <div class="backrow"><button class="linkbtn" id="zone-back">‹ Closet</button>
      <h2>${esc(sec.label)}</h2><span class="hint" style="margin:0">${list.length} item${list.length===1?"":"s"}</span>
      <button class="filterbtn${nf?" on":""}" id="zone-filter">Filter${nf?" · "+nf:""}</button></div>
    ${list.length?`<div class="grid2">`+list.map(it=>itemCard(it)).join("")+`</div>`
      :`<div class="empty"><div class="big">🪹</div><p>No ${esc(sec.label.toLowerCase())} yet.<br>Add your first piece.</p>
        <button class="btn" id="add-in-zone">＋ Add</button></div>`}
    <div style="height:10px"></div>
    ${list.length?`<button class="btn secondary block" id="add-in-zone2">＋ Add to ${esc(sec.label)}</button>`:""}
    </div>`;
  $("#zone-back").addEventListener("click",()=>{S.zone=null;renderCloset();});
  $("#zone-filter").addEventListener("click",()=>openZoneFilter(secKey));
  v.querySelectorAll("[data-item]").forEach(c=>c.addEventListener("click",()=>openItemDetail(c.dataset.item)));
  const add=()=>openAddItem(secKey);
  const a1=$("#add-in-zone"); if(a1)a1.addEventListener("click",add);
  const a2=$("#add-in-zone2"); if(a2)a2.addEventListener("click",add);
}

function renderAddSheet(){

    <div class="field"><label>Fabric</label><div class="chips" id="add-fabric">${tagChips(FABRICS,a.fabric,true)}</div></div>

  $("#add-camera").addEventListener("click",()=>{
    const fi=$("#file-input"); fi.value=""; fi.onchange=async()=>{
      if(!fi.files[0])return;
      try{ const p=await processPhoto(fi.files[0],false);
        addState.photo=p.full; addState.thumb=p.thumb; renderAddSheet();
      }catch(e){ toast("Couldn't read that photo"); }
    }; fi.click();
  });
  const pasteBtn=$("#add-paste");
  if(pasteBtn) pasteBtn.addEventListener("click",async()=>{
    try{
      const cis=await navigator.clipboard.read();
      let got=null;
      for(const ci of cis){ for(const t of ci.types){
        if(t.startsWith("image/")){ got=await ci.getType(t); break; } }
        if(got)break; }
      if(!got){ toast("No image on the clipboard"); return; }
      const p=await processPhoto(got,/png/i.test(got.type));
      addState.photo=p.full; addState.thumb=p.thumb; renderAddSheet();
      toast("Sticker pasted ✨");
    }catch(e){ toast("Paste didn't work — copy a sticker first"); }

      const b=e.target.closest("[data-tag]"); if(!b)return;

      if(multi){ const i=addState[key].indexOf(t);
        i>=0?addState[key].splice(i,1):addState[key].push(t);
      } else addState[key]=addState[key]===t?"":t;
      renderAddSheet();

  bindTags("#add-fabric","fabric",true); bindTags("#add-vibe","vibe",true);

async function startFitCompare(preselect){
  const fits=await dbAll("fits");
  if(fits.length<2){toast("Need at least two fits");return;}
  S.compare={type:"fits",ids:preselect?[preselect]:[]};
  openSheet(`<h3>Compare fits — pick ${preselect?"one more":"two"}</h3>
    <div id="cmp-list">`+fits.map(f=>`
      <div class="fitrow" data-cf="${f.id}">
        <div class="fi"><div class="fn">${esc(f.name)}</div><div class="fo">${esc(f.occasion||"")}</div></div>
        <div style="font-size:22px">${S.compare.ids.includes(f.id)?"✓":"›"}</div>
      </div>`).join("")+`</div>`);
  $("#cmp-list").addEventListener("click",e=>{
    const r=e.target.closest("[data-cf]"); if(!r)return;
    const id=r.dataset.cf, i=S.compare.ids.indexOf(id);
    i>=0?S.compare.ids.splice(i,1):S.compare.ids.push(id);
    if(S.compare.ids.length===2){closeSheet();showCompare();}
    else startFitCompareRefresh();
  });
  function startFitCompareRefresh(){
    $("#cmp-list").querySelectorAll("[data-cf]").forEach(r=>{
      r.lastElementChild.textContent=S.compare.ids.includes(r.dataset.cf)?"✓":"›";
    });
    $("#sheet h3").textContent="Compare fits — pick "+(2-S.compare.ids.length)+" more";
  }
}
async function startItemCompare(firstId){
  S.compare={type:"items",ids:[firstId]};
  const token=S.cmpToken=uid();
  const items=await dbAll("items");
  openSheet(`<h3>Compare — pick another piece</h3><div class="grid2">`+
    items.filter(i=>i.id!==firstId).map(it=>`
      <div class="card" data-ci="${it.id}">

async function showCompare(){
  const v=$("#view-fits"); clearURLs();
  // ensure the fits view is visible (compare can start from item detail on any tab)
  S.tab="fits";
  document.querySelectorAll("#tabbar button").forEach(b=>b.classList.toggle("active",b.dataset.tab==="fits"));

  $("#cmp-back").addEventListener("click",()=>{S.compare={type:null,ids:[]};renderFits();});
}

/* ================= Planner ================= */
function weekStart(offset){
  const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);
  d.setHours(0,0,0,0); return d;
}
async function renderPlanner(){
  const v=$("#view-planner"); clearURLs();
  const ws=weekStart(S.weekOffset);
  const days=[]; for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);days.push(d);}
  const fits=await dbAll("fits"); const fmap={}; fits.forEach(f=>fmap[f.id]=f);
  const slots=await dbAll("slots"); const smap={}; slots.forEach(s=>smap[s.slotId]=s.fitId);
  const tISO=todayISO();
  const wlabel=fmtDate(todayISO(days[0]))+" – "+fmtDate(todayISO(days[6]));
  v.innerHTML=`
    <div class="weeknav">
      <button id="wk-prev" aria-label="Previous week">‹</button>
      <span class="wl">${wlabel}</span>
      <button id="wk-next" aria-label="Next week">›</button>
    </div>
    ${S.copySrc?`<div class="warn" style="margin-top:0">Copying — tap a slot to paste <button class="linkbtn" id="cp-cancel" style="padding:4px">✕</button></div>`:""}
    ${days.map(d=>{
      const iso=todayISO(d), isToday=iso===tISO;
      const dn=d.toLocaleDateString(undefined,{weekday:"long"});
      const slot=(s)=>{const fid=smap[iso+"_"+s];const f=fid&&fmap[fid];
        return `<button class="slot" data-slot="${iso}_${s}">
          <span class="sl">${s==="day"?"DAY":"NIGHT"}</span>
          <span class="sv${f?"":" empty"}">${f?esc(f.name):"+ Add fit"}</span>
          ${f?`<span class="mini" data-copy="${iso}_${s}">⧉</span>`:""}
        </button>`;};
      return `<div class="daycard${isToday?" today":""}">
        <header><span class="dn">${isToday?"Today · ":""}${dn}</span><span class="dd">${fmtDate(iso)}</span></header>
        ${slot("day")}${slot("night")}
        ${isToday?`<button class="slot" id="quick-add"><span class="sl">＋</span><span class="sv">Quick-add to today's outfit</span></button>`:""}
      </div>`;}).join("")}`;
  $("#wk-prev").addEventListener("click",()=>{S.weekOffset--;renderPlanner();});
  $("#wk-next").addEventListener("click",()=>{S.weekOffset++;renderPlanner();});
  const cc=$("#cp-cancel"); if(cc)cc.addEventListener("click",()=>{S.copySrc=null;renderPlanner();});
  const qa=$("#quick-add"); if(qa)qa.addEventListener("click",quickAddToday);
  v.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); S.copySrc=b.dataset.copy; renderPlanner(); toast("Tap a slot to paste");
  }));
  v.querySelectorAll("[data-slot]").forEach(b=>b.addEventListener("click",async()=>{
    const slotId=b.dataset.slot;
    if(S.copySrc){
      const srcFit=(await dbGet("slots",S.copySrc));
      if(srcFit){await dbPut("slots",{slotId,fitId:srcFit.fitId});toast("Copied ✓");}
      S.copySrc=null; renderPlanner(); return;
    }
    pickFitForSlot(slotId);
  }));
}
async function pickFitForSlot(slotId){
  const fits=await dbAll("fits");
  openSheet(`<h3>Pick a fit</h3>
    ${fits.length?fits.map(f=>`
      <div class="fitrow" data-pf="${f.id}">
        <div class="fi"><div class="fn">${esc(f.name)}</div><div class="fo">${esc(f.occasion||"")}</div></div>
        <div style="font-size:22px;color:var(--muted)">›</div></div>`).join("")
    :`<div class="empty"><p>No fits yet — build one first.</p></div>`}
    <div class="rowbtns"><button class="btn secondary" id="pf-clear">Clear slot</button>
    <button class="btn secondary" id="pf-cancel">Cancel</button></div>`);
  $("#pf-cancel").addEventListener("click",closeSheet);
  $("#pf-clear").addEventListener("click",async()=>{await dbDel("slots",slotId);closeSheet();renderPlanner();});
  $("#sheet").querySelectorAll("[data-pf]").forEach(r=>r.addEventListener("click",async()=>{
    await dbPut("slots",{slotId,fitId:r.dataset.pf}); closeSheet(); renderPlanner(); toast("Planned ✓");
  }));
}
async function pickSlotForFit(fitId){
  const ws=weekStart(S.weekOffset), days=[];
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(d.getDate()+i);days.push(d);}
  openSheet(`<h3>Put on planner</h3>`+days.map(d=>{
    const iso=todayISO(d);
    return ["day","night"].map(s=>`
      <button class="slot" data-ps="${iso}_${s}" style="border:2px solid var(--line);border-radius:14px;margin-bottom:10px">
        <span class="sl">${d.toLocaleDateString(undefined,{weekday:"short"})}</span>
        <span class="sv">${fmtDate(iso)} · ${s==="day"?"Day":"Night"}</span>
      </button>`).join("");
  }).join("")+`<div class="rowbtns"><button class="btn secondary" id="ps-cancel">Cancel</button></div>`);
  $("#ps-cancel").addEventListener("click",closeSheet);
  $("#sheet").querySelectorAll("[data-ps]").forEach(b=>b.addEventListener("click",async()=>{
    await dbPut("slots",{slotId:b.dataset.ps,fitId}); closeSheet(); toast("Planned ✓");
  }));
}
/* today's outfit quick-add */
async function quickAddToday(){
  const items=await dbAll("items");
  if(!items.length){toast("Closet is empty — add pieces first");return;}
  S.pickCb={multi:true,title:"Pick pieces for today",done:async(ids)=>{
    if(!ids.length)return;
    const slotId=todayISO()+"_day";
    const ex=await dbGet("slots",slotId);
    let fit=ex?await dbGet("fits",ex.fitId):null;
    if(fit){ fit.itemIds=[...new Set([...fit.itemIds,...ids])]; await dbPut("fits",fit); }
    else { fit={id:uid(),name:"Today's Outfit",occasion:"casual",itemIds:ids,createdAt:Date.now(),wornDates:[]};
      await dbPut("fits",fit); await dbPut("slots",{slotId,fitId:fit.id}); }
    toast("Added to today's outfit ✓"); renderPlanner();
  }};
  openItemPicker();
}
function openItemPicker(){
  const cb=S.pickCb; const sel=new Set();
  let sec="tops";
  const draw=async()=>{
    const items=(await dbAll("items")).filter(i=>i.section===sec);
    openSheet(`<h3>${esc(cb.title)}</h3>
      <div class="chips">${SECTIONS.map(s=>`<button class="chip sm${sec===s.key?" on":""}" data-isec="${s.key}">${esc(s.label)}</button>`).join("")}</div>
      <div class="grid2">${items.map(it=>`
        <div class="card${sel.has(it.id)?" sel":""}" data-ipick="${it.id}">
          <span class="check">✓</span>
          <img loading="lazy" src="${burl(it.thumb||it.full)}">
          <div class="meta"><div class="nm">${esc(it.name||secOf(it.section).label)}</div></div>
        </div>`).join("")||'<div class="hint">Nothing here yet.</div>'}</div>
      <div class="stickybar"><button class="btn secondary" id="ip-cancel">Cancel</button>
      <button class="btn" id="ip-done" ${sel.size?"":"disabled"}>Add (${sel.size})</button></div>`);
    $("#ip-cancel").addEventListener("click",closeSheet);
    $("#sheet").querySelectorAll("[data-isec]").forEach(b=>b.addEventListener("click",()=>{sec=b.dataset.isec;draw();}));
    $("#sheet").querySelectorAll("[data-ipick]").forEach(c=>c.addEventListener("click",()=>{
      const id=c.dataset.ipick;
      if(cb.multi){ sel.has(id)?sel.delete(id):sel.add(id); }
      else { closeSheet(); cb.done([id]); return; }
      draw();
    }));
    $("#ip-done").addEventListener("click",()=>{closeSheet();cb.done([...sel]);});
  };
  draw();
}

/* ================= Shuffle ================= */
function renderShuffle(){
  const v=$("#view-shuffle"); clearURLs();
  const sh=S.shuffle;
  v.innerHTML=`
    <div class="backrow"><button class="linkbtn" id="sh-back">‹ Back</button><h2>Shuffle</h2></div>
    <div class="hint">Pick constraints — the shuffle fills the rest.</div>
    <div class="field"><label>Vibe</label><div class="chips">
      ${VIBES.map(x=>`<button class="chip sm${sh.vibes.includes(x)?" on":""}" data-shv="${esc(x)}">${esc(x)}</button>`).join("")}
    </div></div>
    <div class="field"><label>Color</label><div class="chips">
      ${COLORS.map(x=>`<button class="chip sm${sh.colors.includes(x)?" on":""}" data-shc="${esc(x)}">${esc(x)}</button>`).join("")}
    </div></div>
    <button class="btn block" id="sh-go">🎲 Shuffle a fit</button>
    <div id="sh-result" style="margin-top:6px">${sh.result?shuffleResultHTML():""}</div>`;
  $("#sh-back").addEventListener("click",()=>go("fits"));
  v.querySelectorAll("[data-shv]").forEach(b=>b.addEventListener("click",()=>{
    const x=b.dataset.shv,i=sh.vibes.indexOf(x); i>=0?sh.vibes.splice(i,1):sh.vibes.push(x); renderShuffle();
  }));
  v.querySelectorAll("[data-shc]").forEach(b=>b.addEventListener("click",()=>{
    const x=b.dataset.shc,i=sh.colors.indexOf(x); i>=0?sh.colors.splice(i,1):sh.colors.push(x); renderShuffle();
  }));
  $("#sh-go").addEventListener("click",async()=>{ await doShuffle(); });
  bindShuffleResult();
}
function matchTags(it){
  const sh=S.shuffle;
  if(sh.vibes.length&&!it.vibe.some(x=>sh.vibes.includes(x)))return false;
  if(sh.colors.length&&!it.color.some(x=>sh.colors.includes(x)))return false;
  return true;
}
const pickR=a=>a.length?a[Math.floor(Math.random()*a.length)]:null;
async function doShuffle(){
  const items=await dbAll("items");
  const bySec=k=>{const m=items.filter(i=>i.section===k&&matchTags(i));
    return m.length?m:items.filter(i=>i.section===k);};
  const res={};
  res.hijab=pickR(bySec("hijab"));
  const useDress=Math.random()<0.4&&bySec("dresses").length>0;
  if(useDress){res.dresses=pickR(bySec("dresses"));}
  else{res.tops=pickR(bySec("tops"));res.bottoms=pickR(bySec("bottoms"));}
  res.shoes=pickR(bySec("shoes")); res.bags=pickR(bySec("bags"));
  if(Math.random()<0.6)res.jewelry=pickR(bySec("jewelry"));
  if(Math.random()<0.4)res.jackets=pickR(bySec("jackets"));
  S.shuffle.result=res;
  renderShuffle();
  const r=$("#sh-result"); if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function shuffleResultHTML(){
  const res=S.shuffle.result; if(!res)return "";
  const order=["hijab","tops","dresses","bottoms","shoes","bags","jewelry","jackets"];
  const rows=order.filter(k=>res[k]).map(k=>{
    const it=res[k];
    return `<div class="piece"><img src="${burl(it.thumb||it.full)}">
      <div style="flex:1"><div class="pl">${esc(secOf(k).label)}</div>
      <div class="pn">${esc(it.name||SINGULAR[k])}</div></div>
      <button class="btn secondary small" data-reroll="${k}">⟳</button></div>`;
  }).join("");
  return `<h2 class="sec">Your shuffle</h2><div class="composite">${rows}</div>
    <div class="rowbtns"><button class="btn secondary" id="sh-again">🎲 Again</button>
    <button class="btn" id="sh-save">Save as fit</button></div>`;
}
function bindShuffleResult(){
  const v=$("#view-shuffle");
  v.querySelectorAll("[data-reroll]").forEach(b=>b.addEventListener("click",async()=>{
    const k=b.dataset.reroll, items=await dbAll("items");
    const m=items.filter(i=>i.section===k&&matchTags(i));
    const pool=m.length?m:items.filter(i=>i.section===k);
    const cur=S.shuffle.result[k];
    const alt=pool.filter(i=>i.id!==(cur&&cur.id));
    S.shuffle.result[k]=pickR(alt.length?alt:pool)||cur;
    renderShuffle();
  }));
  const ag=$("#sh-again"); if(ag)ag.addEventListener("click",doShuffle);
  const sv=$("#sh-save"); if(sv)sv.addEventListener("click",()=>{
    const ids=Object.values(S.shuffle.result).filter(Boolean).map(i=>i.id);
    openSheet(`<h3>Save shuffle</h3>
      <div class="field"><label>Name</label><input type="text" id="sh-name" placeholder="e.g. Saturday night"></div>
      <div class="field"><label>Occasion</label><div class="chips" id="sh-occ">
        ${OCCASIONS.map(o=>`<button class="chip sm${o==="casual"?" on":""}" data-so="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>
      <div class="rowbtns"><button class="btn secondary" id="sh-cx">Cancel</button>
      <button class="btn" id="sh-ok">Save</button></div>`);
    let occ="casual";
    $("#sh-occ").addEventListener("click",e=>{const b=e.target.closest("[data-so]");if(!b)return;occ=b.dataset.so;
      $("#sh-occ").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));});
    $("#sh-cx").addEventListener("click",closeSheet);
    $("#sh-ok").addEventListener("click",async()=>{
      const nm=$("#sh-name").value.trim()||("Shuffle · "+fmtDate(todayISO()));
      await dbPut("fits",{id:uid(),name:nm,occasion:occ,itemIds:ids,createdAt:Date.now(),wornDates:[]});
      closeSheet(); toast("Fit saved ✓"); S.shuffle.result=null; go("fits");
    });
  });
}

/* ================= Export ================= */
$("#export-btn").addEventListener("click",async()=>{
  $("#menu-pop").classList.remove("open");
  toast("Preparing backup…");
  try{
    const [items,fits,slots]=await Promise.all([dbAll("items"),dbAll("fits"),dbAll("slots")]);
    const out={app:"outfit-app",version:1,exportedAt:new Date().toISOString(),
      items:[],fits:fits.map(({id,name,occasion,itemIds,createdAt,wornDates})=>({id,name,occasion,itemIds,createdAt,wornDates})),
      slots};
    for(const it of items){
      out.items.push({id:it.id,section:it.section,category:it.category,name:it.name,
        color:it.color,fabric:it.fabric,vibe:it.vibe,createdAt:it.createdAt,wornDates:it.wornDates,
        photo:await photoToDataURL(it.full),thumb:await photoToDataURL(it.thumb)});
    }
    const blob=new Blob([JSON.stringify(out)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="outfit-backup-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast("Backup downloaded ✓");
  }catch(e){ toast("Backup failed"); }
});
async function photoToDataURL(src){
  if(!src) return null;
  const blob = typeof src==="string"
    ? await (await fetch(src,{credentials:"include"})).blob()
    : src;
  return blobToDataURL(blob);
}
$("#logout-btn").addEventListener("click",async()=>{
  $("#menu-pop").classList.remove("open");
  try{ await fetch(API+"/api/logout",{method:"POST",credentials:"include"}); }catch(e){}
  location.reload();
});

/* ================= Init ================= */
(async function init(){
  let me = null;
  try{
    const r = await fetch(API + "/api/me", { credentials:"include" });
    if (r.ok) me = await r.json();
  }catch(e){}
  if(!me){ showLogin(); return; }
  S.user = me;
  go("closet");
})();

function showLogin(){
  $("#app").innerHTML = `<div class="loginwrap"><div class="logincard">
    <h2>My Closet</h2><p>Sign in to your closet</p>
    <input id="login-user" type="text" placeholder="Username" autocomplete="username" autocapitalize="none">
    <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
    <div id="login-err"></div>
    <button id="login-go">Sign in</button></div></div>`;
  const submit = async ()=>{
    const username = $("#login-user").value.trim(), password = $("#login-pass").value;
    $("#login-err").textContent = "";
    if(!username || !password){ $("#login-err").textContent = "Enter username and password"; return; }
    try{
      const r = await fetch(API + "/api/login", { method:"POST", credentials:"include",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ username, password }) });
      if(!r.ok){ $("#login-err").textContent = r.status===429 ? "Too many tries — wait a bit and retry" : "Wrong username or password"; return; }
      location.reload();
    }catch(e){ $("#login-err").textContent = "Can't reach the server — check your connection"; }
  };
  $("#login-go").addEventListener("click", submit);
  $("#login-pass").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  setTimeout(()=>$("#login-user").focus(), 50);
}
</script>
